# Deploys the Bandcamp relay Worker (workers/bandcamp-proxy) to Cloudflare.
#
# Runs on every merge to main that touches the worker, and by hand from the
# Actions tab ("Run workflow"). It needs one repository secret:
#
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers"
#                          template, scoped to the account and the simonlowes.com
#                          zone, plus Zone > DNS > Edit so the custom domain
#                          player.simonlowes.com can be created.
#
# CLOUDFLARE_ACCOUNT_ID is only needed if that token can see more than one account.

name: Deploy Bandcamp relay

on:
  push:
    branches: [main]
    paths:
      - "workers/bandcamp-proxy/**"
      - ".github/workflows/deploy-bandcamp-proxy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bandcamp-proxy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/bandcamp-proxy
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: workers/bandcamp-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx wrangler deploy

      - name: Wait for the relay to answer
        run: |
          for attempt in $(seq 1 18); do
            body=$(curl -sS --max-time 20 https://player.simonlowes.com/health || true)
            echo "attempt $attempt: ${body:-no response}"
            case "$body" in
              *'"ok":true'*) echo "Relay is up."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::https://player.simonlowes.com/health did not report ok within three minutes. Check the deploy log above and the Worker in the Cloudflare dashboard."
          exit 1
