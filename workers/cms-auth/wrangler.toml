name = "simonlowes-cms-auth"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Same pattern as workers/media-api: a custom domain on the Cloudflare zone.
routes = [
  { pattern = "cms-auth.simonlowes.com", custom_domain = true }
]

[vars]
# Hostnames allowed to complete the sign-in handshake (comma-separated, * wildcard).
ALLOWED_DOMAINS = "simonlowes.com, www.simonlowes.com, simonlowes.simonlowes.cloud"

# Secrets, set once with `npx wrangler secret put <NAME>` (never in this file):
#   GITHUB_CLIENT_ID      Client ID of the GitHub OAuth App
#   GITHUB_CLIENT_SECRET  Client secret of the same app
# The OAuth App's callback URL must be https://cms-auth.simonlowes.com/callback
